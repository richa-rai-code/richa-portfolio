     To update links: edit the href values below.
     All placeholders are marked with data-placeholder="true".
══════════════════════════════════════════ -->
<section class="section" id="contact" aria-labelledby="contact-heading">
  <div class="container contact-container">
    <p class="section-label reveal">Say Hello</p>
    <h2 id="contact-heading" class="section-heading reveal">
      Have an idea?<br />Let's connect.
    </h2>
    <p class="contact-desc reveal reveal-delay-1">
      I'm always interested in learning, collaborating, and connecting
      with people who enjoy building useful things.
    </p>

    <div class="contact-links reveal reveal-delay-2">

      <!--
        PLACEHOLDER: Replace href value with your real email address.
        Example: href="mailto:richa@example.com"
        Also update the visible text in the <span class="contact-text"> tag.
        Remove data-placeholder="true" once updated.
      -->
      <a
        href="mailto:your.email@example.com"
        class="contact-item"
        aria-label="Email Richa Rai"
        data-placeholder="true"
      >
        <span class="contact-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
          </svg>
        </span>
        <span class="contact-text">your.email@example.com</span>
        <span class="contact-arrow" aria-hidden="true">&#8594;</span>
      </a>

      <!--
        PLACEHOLDER: Replace href="#" with your real GitHub profile URL.
        Example: href="https://github.com/your-username"
        Remove data-placeholder="true" once updated.
      -->
      <a
        href="#"
        class="contact-item"
        aria-label="Richa Rai on GitHub"
        target="_blank"
        rel="noopener noreferrer"
        data-placeholder="true"
      >
        <span class="contact-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
          </svg>
        </span>
        <span class="contact-text">github.com/your-username</span>
        <span class="contact-arrow" aria-hidden="true">&#8594;</span>
      </a>

      <!--
        PLACEHOLDER: Replace href="#" with your real LinkedIn profile URL.
        Example: href="https://linkedin.com/in/richa-rai"
        Remove data-placeholder="true" once updated.
      -->
      <a
        href="#"
        class="contact-item"
        aria-label="Richa Rai on LinkedIn"
        target="_blank"
        rel="noopener noreferrer"
        data-placeholder="true"
      >
        <span class="contact-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
          </svg>
        </span>
        <span class="contact-text">linkedin.com/in/richa-rai</span>
        <span class="contact-arrow" aria-hidden="true">&#8594;</span>
      </a>

    </div>
  </div>
</section>
