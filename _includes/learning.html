<!-- ══════════════════════════════════════════
     LEARNING JOURNEY — _includes/learning.html
     Data source: _data/learning.yml
══════════════════════════════════════════ -->
<section class="section section-alt" id="learning" aria-labelledby="learning-heading">
  <div class="container" style="position:relative;">
    <span class="section-watermark" aria-hidden="true">04</span>
    <div style="position:relative;z-index:1;">
      <p class="section-label reveal">What's Next</p>
      <h2 id="learning-heading" class="section-heading reveal">
        Currently<br /><em>exploring.</em>
      </h2>

      <div class="learning-grid">
        {% for item in site.data.learning %}
        {% assign idx = forloop.index | prepend: "0" | slice: -2, 2 %}
        <div class="learning-item reveal reveal-delay-{{ forloop.index }}">
          <p class="learning-index">{{ idx }}</p>
          <h3 class="learning-title">{{ item.title }}</h3>
          <p class="learning-desc">{{ item.description }}</p>
        </div>
        {% endfor %}
      </div>
    </div>
  </div>
</section>
