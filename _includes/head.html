<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>{% if page.title and page.title != "" %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }} — BCA Student · Data Science & AI{% endif %}</title>
    <meta
      name="description"
      content="{% if page.description %}{{ page.description | escape }}{% else %}{{ site.description | escape }}{% endif %}"
    />
    <meta name="author" content="{{ site.author }}" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0a0908" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{% if page.title and page.title != "" %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }} — BCA Student · Data Science & AI{% endif %}" />
    <meta
      property="og:description"
      content="{% if page.description %}{{ page.description | escape }}{% else %}{{ site.description | escape }}{% endif %}"
    />
    {% if site.url %}<meta property="og:url" content="{{ page.url | absolute_url }}" />{% endif %}

    <!-- Favicon – elegant 'R' monogram -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='12' fill='%230a0908'/><text x='50' y='72' font-family='Georgia,serif' font-size='62' font-weight='bold' fill='%23c9a96e' text-anchor='middle'>R</text></svg>" />

    <!-- Google Fonts: Cormorant Garamond (display) + Inter (sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,600&family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;1,14..32,400&display=swap"
      rel="stylesheet"
    />

    <!-- Stylesheet -->
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />

    <!--
      PRELOADER SESSION GATE & CRITICAL STYLES
      Runs synchronously before first paint.
      Shows on:
        1. First visit in session (!sessionStorage.rrPlShown)
        2. Hard refresh or browser reload (PerformanceNavigationTiming.type === 'reload')
      Never shows on ordinary in-session navigation.
      Critical CSS prevents any flash of unstyled content or background flicker.
    -->
    <style id="pl-critical-style">
      html[data-preloader="active"] {
        background-color: #080706 !important;
      }
      html[data-preloader="active"] body {
        overflow: hidden !important;
      }
      html[data-preloader="active"] #preloader {
        position: fixed !important;
        inset: 0 !important;
        z-index: 99999 !important;
        background-color: #080706 !important;
        display: flex !important;
        opacity: 1 !important;
        visibility: visible !important;
        pointer-events: auto !important;
      }
      html:not([data-preloader="active"]) #preloader {
        display: none !important;
      }
    </style>
    <script>
      (function(){
        try {
          var isReload = false;
          if (window.performance) {
            var nav = performance.getEntriesByType ? performance.getEntriesByType('navigation')[0] : null;
            if (nav && nav.type === 'reload') {
              isReload = true;
            } else if (performance.navigation && performance.navigation.type === 1) {
              isReload = true;
            }
          }
          if (isReload || !sessionStorage.getItem('rrPlShown')) {
            document.documentElement.setAttribute('data-preloader','active');
          }
        } catch(e) {
          /* Fallback gracefully */
        }
      })();
    </script>
  </head>
